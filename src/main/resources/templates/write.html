<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post == null} ? '게시글 작성' : '게시글 수정'">게시글 작성</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="text/javascript" th:src="@{/smarteditor2/js/HuskyEZCreator.js}" charset="utf-8"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; }
        .smarteditor2 { width: 100% !important; }
        .smarteditor2 .se2_toolbar { white-space: normal !important; flex-wrap: wrap; }
        .drop-zone-over { border-color: #3B82F6; background-color: #EFF6FF; }
    </style>
</head>
<body>

<div class="w-[1200px] mx-auto bg-white">
    <div class="w-[1140px] mx-auto">
        <div th:replace="~{fragments/header :: header}"></div>

        <div class="flex flex-col lg:flex-row lg:space-x-8 mt-[30px]">

            <main class="flex-1">
                <form th:action="${post == null} ? @{/board/save} : @{/board/update}"
                      method="post" id="post-form" enctype="multipart/form-data">

                    <input type="hidden" name="id" th:if="${post != null}" th:value="${post.id}">

                    <div class="flex justify-between items-center mb-4">
                        <div class="flex items-center gap-2">
                            <select name="categoryId" class="h-8 px-3 py-1 rounded-md border border-gray-300 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="1" th:selected="${post != null and post.mainCategoryId == 1}">꿀팁</option>
                                <option value="2" th:selected="${post != null and post.mainCategoryId == 2}">질문</option>
                                <option value="3" th:selected="${post != null and post.mainCategoryId == 3}">후기</option>
                                <option value="4" th:selected="${post != null and post.mainCategoryId == 4}">잡담</option>
                            </select>

                            <input type="text" name="title"
                                   th:value="${post?.title}"
                                   placeholder="제목" class="w-[500px] h-8 px-3 py-1 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-sm text-gray-500">작성자:</span>
                            <span class="font-semibold text-gray-800"
                                  th:text="${#authentication.principal.nickname}">[작성자명]</span>
                        </div>
                    </div>

                    <div class="mb-4">
                            <textarea name="content" id="smartEditor" rows="10"
                                      class="w-full h-[500px] p-4 border border-gray-300 rounded-md"
                                      placeholder="내용을 입력하세요"
                                      th:text="${post?.content}"></textarea>
                    </div>

                    <div class="flex gap-2 my-4">
                        <button type="button" id="btn-image-attach" class="w-[120px] h-[50px] bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium rounded-lg transition-colors">이미지 첨부</button>
                        <button type="button" id="btn-file-attach" class="w-[120px] h-[50px] bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium rounded-lg transition-colors">파일 첨부</button>
                    </div>

                    <div id="image-upload-area" class="hidden my-4 p-4 border rounded-md">
                        <div id="image-drop-zone" class="border-2 border-dashed border-gray-300 rounded-lg p-10 text-center text-gray-500 cursor-pointer hover:bg-gray-50 transition-colors">
                            이미지를 업로드하려면 여기에 이미지를 끌어놓거나 클릭하세요
                            <input type="file" id="image-input-hidden" multiple accept="image/*" class="hidden">
                        </div>
                        <div id="image-preview-container" class="mt-4 grid grid-cols-5 gap-4"></div>
                        <div class="flex justify-end mt-4">
                            <button type="button" id="btn-ajax-upload" class="w-[120px] h-[50px] bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium rounded-lg border border-gray-300">업로드</button>
                        </div>
                    </div>
                    <div class="flex justify-end items-center gap-4 mt-8">
                        <button type="submit" id="btn-submit" class="w-[120px] h-[50px] bg-black hover:bg-gray-800 text-white font-semibold rounded-lg transition-colors"
                                th:text="${post == null} ? '작성완료' : '수정완료'">
                            작성완료
                        </button>
                    </div>
                </form>

            </main>

            <aside class="w-full lg:w-80 lg:flex-shrink-0 mt-8 lg:mt-0">
                <div class="bg-white rounded-lg shadow-md h-[1000px] flex items-center justify-center border">
                    <div class="ad-box"></div>
                </div>
            </aside>

        </div>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<script>
    // (스크립트 내용은 기존과 동일하게 유지)
    var oEditors = [];
    let selectedFiles = [];

    document.addEventListener('DOMContentLoaded', function() {
        // ... (기존 로직 유지) ...

        nhn.husky.EZCreator.createInIFrame({
            oAppRef: oEditors,
            elPlaceHolder: "smartEditor",
            sSkinURI: "/smarteditor2/SmartEditor2Skin.html",
            htParams: {
                bUseToolbar: true,
                bUseVerticalResizer: true,
                bUseModeChanger: true,
                fWidth: "100%"
            },
            fOnAppLoad : function(){
                oEditors.getById["smartEditor"].exec("LOAD_AND_BIND_EVENT", ["photo_upload"]);
            },
            sUpdateImageAPIName: "/upload-image-smarteditor",
            fCreator: "createSEditor2"
        });

        const form = document.getElementById('post-form');
        const submitButton = document.getElementById('btn-submit');
        submitButton.addEventListener('click', (e) => {
            oEditors.getById["smartEditor"].exec("UPDATE_CONTENTS_FIELD", []);

            const title = form.title.value;
            const content = form.content.value;

            if (title.trim() === "") {
                alert("제목을 입력해주세요.");
                form.title.focus();
                e.preventDefault();
                return;
            }
            // 스마트에디터 기본값 태그 제외하고 내용이 없는지 체크
            if (content.trim() === "" || content.trim() === "<p>&nbsp;</P>" || content.trim() === "<p>&nbsp;</p>") {
                alert("내용을 입력해주세요.");
                oEditors.getById["smartEditor"].exec("FOCUS");
                e.preventDefault();
                return;
            }
        });

        // ... (드래그앤드롭 로직 유지) ...
        // ... (기존 스크립트 그대로 사용) ...
        const btnImageAttach = document.getElementById('btn-image-attach');
        const imageUploadArea = document.getElementById('image-upload-area');
        const dropZone = document.getElementById('image-drop-zone');
        const fileInput = document.getElementById('image-input-hidden');
        const previewContainer = document.getElementById('image-preview-container');
        const ajaxUploadButton = document.getElementById('btn-ajax-upload');

        btnImageAttach.addEventListener('click', () => {
            imageUploadArea.classList.toggle('hidden');
        });

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => addFilesToList(e.target.files));
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drop-zone-over'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drop-zone-over'));
        dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('drop-zone-over'); addFilesToList(e.dataTransfer.files); });

        ajaxUploadButton.addEventListener('click', () => {
            if (selectedFiles.length === 0) return alert("이미지를 선택하세요.");
            const formData = new FormData();
            selectedFiles.forEach(file => formData.append('images', file));

            fetch('/upload-images-dragdrop', { method: 'POST', body: formData })
            .then(r => r.json())
            .then(data => {
                if(data.urls){
                    let html = '';
                    data.urls.forEach(u => html += `<img src="${u}" style="max-width:100%"><br>`);
                    oEditors.getById["smartEditor"].exec("PASTE_HTML", [html]);
                    selectedFiles=[]; previewContainer.innerHTML=''; alert("삽입완료");
                }
            });
        });

        function addFilesToList(files) {
            for (const f of files) { if(f.type.startsWith('image/')) createPreview(f); }
        }
        function createPreview(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                 const div = document.createElement('div'); div.className='relative';
                 div.innerHTML = `<img src="${e.target.result}" class="w-full h-24 object-cover rounded"><button type="button" class="absolute top-1 right-1 bg-black text-white rounded-full w-5 h-5 text-xs">X</button>`;
                 div.querySelector('button').onclick = () => { div.remove(); selectedFiles = selectedFiles.filter(f=>f!==file); };
                 previewContainer.appendChild(div);
                 selectedFiles.push(file);
            };
            reader.readAsDataURL(file);
        }
    });
</script>
</body>
</html>
