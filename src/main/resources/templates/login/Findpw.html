<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <title>비밀번호 찾기</title>
</head>
<body>
<div class="container">
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="reset-form">
        <h2 class="reset-form__title">Reset Password</h2>
        <p class="reset-form__subtitle">Enter your Email address</p>

        <form id="reset-form" action="/reset-password" method="post" novalidate>

            <div class="reset-form__group">
                <label for="email" class="reset-form__label">Email*</label>
                <input type="email" id="email" name="email" class="reset-form__input" placeholder="Email address" required>
            </div>

            <div class="reset-form__group password-group hidden">
                <label for="password" class="reset-form__label">Password*</label>
                <input type="password" id="password" name="password" class="reset-form__input" placeholder="Password">
            </div>

            <div class="reset-form__group password-group hidden">
                <label for="password-check" class="reset-form__label">Password check*</label>
                <!-- name 속성을 passwordCheck로 변경 -->
                <input type="password" id="password-check" name="passwordCheck" class="reset-form__input" placeholder="Password check">
            </div>

            <button type="submit" class="reset-form__button">reset password</button>

        </form>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
<script>
    const urlParams = new URLSearchParams(window.location.search);

    // 로그인 성공/실패
    if (urlParams.get("loginSuccess") === "true") {
        alert("로그인 성공!");
    }
    if (urlParams.get("loginFail") === "true") {
        alert("로그인 실패! 이메일 또는 비밀번호 확인");
    }

    // 회원가입 성공/실패
    if (urlParams.get("signupSuccess") === "true") {
        alert("회원가입 완료!");
    }
    if (urlParams.get("signupFail") === "passwordMismatch") {
        alert("비밀번호 확인이 일치하지 않습니다");
    }
    if (urlParams.get("signupFail") === "emailExists") {
        alert("이미 사용 중인 이메일입니다");
    }
    if (urlParams.get("signupFail") === "nicknameExists") {
        alert("이미 사용 중인 닉네임입니다");
    }

    // 비밀번호 재설정 성공/실패
    if (urlParams.get("resetSuccess") === "true") {
        alert("비밀번호 변경 완료!");
    }
    if (urlParams.get("resetFail") === "true") {
        alert("비밀번호 변경 실패!");
    }

    // model.addAttribute("error")는 thymeleaf에서 alert 처리 가능
</script>


<script>
    document.addEventListener('DOMContentLoaded', function() {
        const emailInput = document.getElementById('email');
        const passwordGroups = document.querySelectorAll('.password-group');
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        const hasEmailError = document.querySelector('[th\\:errors="*{email}"]') !== null;
        const hasPasswordError = document.querySelector('[th\\:errors="*{password}"]') !== null ||
            document.querySelector('[th\\:errors="*{passwordCheck}"]') !== null;

        if ((emailInput.value !== '' && !hasEmailError) || hasPasswordError) {
            passwordGroups.forEach(group => group.classList.remove('hidden'));
        }

        emailInput.addEventListener('blur', function() {
            if (emailRegex.test(emailInput.value)) {
                passwordGroups.forEach(group => group.classList.remove('hidden'));
            } else {
                passwordGroups.forEach(group => group.classList.add('hidden'));
            }
        });
    });
</script>
</body>
</html>
