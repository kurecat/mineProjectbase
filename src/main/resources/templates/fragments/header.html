<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header class="main-header" th:fragment="header">
    <div class="header-top">
        <div class="search-container">
            <form th:action="@{/main/search}">
                <input type="search" placeholder="검색" name="query"/>
                <button type="submit" class="search-icon">⚲</button>
            </form>
        </div>

        <div class="logo-container">
            <a th:href="@{/}"
            ><img th:src="@{/Image/logo.png}" alt="Agit 로고"
            /></a>
        </div>

        <div class="user-container">

            <div sec:authorize="isAnonymous()">
                <a th:href="@{login/login}" class="signout-btn">Sign In</a>
            </div>

            <div sec:authorize="isAuthenticated()">
                <a th:href="@{/mypage}" class="user-icon">
                </a>

                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button class="signout-btn" type="submit">Sign Out</button>
                </form>
            </div>

        </div>

    </div>

    <nav class="header-nav">
        <ul>
            <li><a href="#">꿀팁</a></li>
            <li><a href="#">질문</a></li>
            <li><a href="#">후기</a></li>
            <li><a href="#">잡담</a></li>
        </ul>
    </nav>
</header>
</body>
</html>
