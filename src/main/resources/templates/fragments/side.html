<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<body>
<div th:fragment="side">
    <table th:each="highScore : ${highScores}">
        <thead>
        <tr>
            <th>닉네임</th>
            <th>포인트</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td th:text="${highScore.nickname}"></td>
            <td th:text="${highScore.point}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
