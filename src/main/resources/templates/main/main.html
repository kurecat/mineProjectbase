<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>main</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<div class="container">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="main-content">
        <div class="swiper mySwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide video-slide">
                    <div id="player1" class="youtube-player-background"></div>
                    <div class="slide-content">
                        <h1>자취의 교과서 같은 집</h1>
                        <p>신림 4평 원룸 월세</p>
                        <button class="slide-btn">자세히 보기 ></button>
                    </div>
                </div>

                <div class="swiper-slide video-slide">
                    <div id="player2" class="youtube-player-background"></div>
                    <div class="slide-content">
                        <h1>자취요리 전문가의 집</h1>
                        <p>"집에서 3끼 다 해먹어요"</p>
                        <button class="slide-btn">자세히 보기 ></button>
                    </div>
                </div>

                <div class="swiper-slide video-slide">
                    <div id="player3" class="youtube-player-background"></div>
                    <div class="slide-content">
                        <h1>고물가 시대에서 살아남기</h1>
                        <p>-자취쿠팡 필수템편-</p>
                        <a href="https://www.youtube.com/watch?v=zzBu5eSM7bU&t" target="_blank">
                            <button class="slide-btn">자세히 보기 ></button>
                        </a>
                    </div>
                </div>

                <div class="swiper-slide">
                    <img src="https://placehold.co/1140x400/2ecc71/ffffff?text=Slide+3" alt="Slide 3" />
                </div>
            </div>

            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-pagination"></div>
        </div>

        <div class="postlistbox">
            <div th:replace="~{fragments/posts :: posts}"></div>
        </div>

        <nav class="pistlistrightbox">
            <div th:replace="~{fragments/side :: side}"></div>
        </nav>

        <div class="bastpostbox">
            <div th:replace="~{fragments/popular :: popular}"></div>
        </div>

        <div class="suggestpostbox">
            <div th:replace="~{fragments/recommended :: recommended}"></div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
<script>const urlParams = new URLSearchParams(window.location.search);

if (urlParams.get("loginSuccess") === "true") {
    alert("로그인 성공!");
}

if (urlParams.get("signupSuccess") === "true") {
    alert("회원가입 완료!");
}

if (urlParams.get("resetSuccess") === "true") {
    alert("비밀번호 변경 완료!");
}</script>
<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
    var players = {};
    var mySwiper;

    function onYouTubeIframeAPIReady() {
        players["player1"] = new YT.Player("player1", {
            videoId: "oMeYMLRwKrY",
            playerVars: {
                autoplay: 1,
                mute: 1,
                controls: 0,
                loop: 1,
                playlist: "oMeYMLRwKrY",
                modestbranding: 1,
                showinfo: 0,
                rel: 0,
            },
            events: {
                onReady: onPlayerReady,
            },
        });

        players["player2"] = new YT.Player("player2", {
            videoId: "XJ8b9sWVFb0",
            playerVars: {
                autoplay: 1,
                mute: 1,
                controls: 0,
                loop: 1,
                playlist: "XJ8b9sWVFb0",
                modestbranding: 1,
                showinfo: 0,
                rel: 0,
            },
            events: {
                onReady: onPlayerReady,
            },
        });

        players["player3"] = new YT.Player("player3", {
            videoId: "zzBu5eSM7bU",
            playerVars: {
                autoplay: 1,
                mute: 1,
                controls: 0,
                loop: 1,
                playlist: "zzBu5eSM7bU",
                modestbranding: 1,
                showinfo: 0,
                rel: 0,
            },
            events: {
                onReady: onPlayerReady,
            },
        });
    }

    var playersReadyCount = 0;
    var totalPlayers = 3;

    function onPlayerReady(event) {
        playersReadyCount++;
        if (playersReadyCount === totalPlayers) {
            initializeSwiper();
        }
    }

    function initializeSwiper() {
        if (mySwiper) return;

        mySwiper = new Swiper(".mySwiper", {
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },
            loop: true,

            on: {
                slideChange: function () {
                    var currentSlide = this.slides[this.activeIndex];
                    var activePlayerId = null;
                    var playerElem = currentSlide.querySelector(".youtube-player-background");

                    if (playerElem) {
                        activePlayerId = playerElem.id;
                    }

                    for (var playerId in players) {
                        var player = players[playerId];

                        if (playerId === activePlayerId) {
                            player.playVideo();
                        } else {
                            player.pauseVideo();
                        }
                    }
                },

                init: function () {
                    this.emit("slideChange");
                },
            },
        });
    }
</script>

</body>
</html>
