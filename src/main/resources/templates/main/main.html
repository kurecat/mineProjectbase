<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>main</title>

    <link rel="stylesheet" th:href="@{/css/swiper-bundle.min.css}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="container">
    <div th:replace="~{fragments/header :: header}"></div>
    <main class="main-content">
        <div class="swiper mySwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide video-slide">
                    <div id="player1" class="youtube-player-background"></div>
                    <div class="slide-content">
                        <h1>자취의 교과서 같은 집</h1>
                        <p>신림 4평 원룸 월세</p>
                        <button class="slide-btn">자세히 보기 &gt;</button>
                    </div>
                </div>

                <div class="swiper-slide video-slide">
                    <div id="player2" class="youtube-player-background"></div>
                    <div class="slide-content">
                        <h1>자취요리 전문가의 집</h1>
                        <p>"집에서 3끼 다 해먹어요"</p>
                        <button class="slide-btn">자세히 보기 &gt;</button>
                    </div>
                </div>

                <div class="swiper-slide video-slide">
                    <div id="player3" class="youtube-player-background"></div>
                    <div class="slide-content">
                        <h1>고물가 시대에서 살아남기</h1>
                        <p>-자취쿠팡 필수템편-</p>
                        <a
                                href="https://www.youtube.com/watch?v=zzBu5eSM7bU&t"
                                target="_blank"
                        ><button class="slide-btn">자세히 보기 &gt;</button></a
                        >
                    </div>
                </div>
            </div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-pagination"></div>
        </div>

        <div class="postlist">

            <div class="postlist-header">
                <a href="/" class="category-link">전체</a>
                <a th:href="@{/(category='꿀팁')}" class="category-link">꿀팁</a>
                <a th:href="@{/(category='질문')}" class="category-link">질문</a>
                <a th:href="@{/(category='후기')}" class="category-link">후기</a>
                <a th:href="@{/(category='잡담')}" class="category-link">잡담</a>
                <a th:href="@{/board/write}" class="write-button" style="margin-left: auto;">글쓰기</a>
            </div>

            <hr />

            <div id="post-list-content-wrapper">
                <div th:replace="~{fragments/postListContent :: postListContentFragment}">
                </div>
            </div>

        </div>
        <div class="postlistright"></div>
        <div class="misclist">
            <div th:replace="~{fragments/miscListContent :: miscListContentFragment}"></div>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

<script th:src="@{/js/swiper-bundle.min.js}"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
    // (기존 YouTube / Swiper 스크립트...)
    var players = {};
    var mySwiper;

    function onYouTubeIframeAPIReady() {
      players["player1"] = new YT.Player("player1", {
        videoId: "oMeYMLRwKrY",
        playerVars: { autoplay: 1, mute: 1, controls: 0, loop: 1, playlist: "oMeYMLRwKrY", modestbranding: 1, showinfo: 0, rel: 0 },
        events: { onReady: onPlayerReady },
      });
      players["player2"] = new YT.Player("player2", {
        videoId: "XJ8b9sWVFb0",
        playerVars: { autoplay: 1, mute: 1, controls: 0, loop: 1, playlist: "XJ8b9sWVFb0", modestbranding: 1, showinfo: 0, rel: 0 },
        events: { onReady: onPlayerReady },
      });
      players["player3"] = new YT.Player("player3", {
        videoId: "zzBu5eSM7bU",
        playerVars: { autoplay: 1, mute: 1, controls: 0, loop: 1, playlist: "zzBu5eSM7bU", modestbranding: 1, showinfo: 0, rel: 0 },
        events: { onReady: onPlayerReady },
      });
    }

    var playersReadyCount = 0;
    var totalPlayers = 3;

    function onPlayerReady(event) {
      playersReadyCount++;
      if (playersReadyCount === totalPlayers) {
        initializeSwiper();
      }
    }

    function initializeSwiper() {
      if (mySwiper) return;

      mySwiper = new Swiper(".mySwiper", {
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
        loop: true,
        on: {
          slideChange: function () {
            var currentSlide = this.slides[this.activeIndex];
            var activePlayerId = null;
            if (currentSlide.querySelector(".youtube-player-background")) {
              activePlayerId = currentSlide.querySelector(
                ".youtube-player-background"
              ).id;
            }
            for (var playerId in players) {
              if (players.hasOwnProperty(playerId)) {
                var player = players[playerId];
                if (playerId === activePlayerId) {
                  player.playVideo();
                } else {
                  player.pauseVideo();
                }
              }
            }
          },
          init: function () {
            this.emit("slideChange");
          },
        },
      });
    }
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {

      const filterContainer = document.querySelector(".postlist");
      const contentWrapper = document.getElementById("post-list-content-wrapper"); // AJAX 교체 대상

      // --- 1. 카테고리 링크 AJAX 처리 (수정) ---
      if (filterContainer) {
        const filterButtons = filterContainer.querySelectorAll(".category-link");

        // (기존 active 클래스 설정 로직...)
        const urlParams = new URLSearchParams(window.location.search);
        const currentCategory = urlParams.get('category');
        filterButtons.forEach((button) => {
            const buttonHref = button.getAttribute("href");
            let buttonCategory = null;
            if (buttonHref.includes("category=")) {
                buttonCategory = buttonHref.split("=")[1];
            } else if (buttonHref === "/") {
                buttonCategory = "ALL";
            }
            if (currentCategory === null && buttonCategory === "ALL") {
                button.classList.add("active");
            } else if (buttonCategory === currentCategory) {
                button.classList.add("active");
            }

            // --- 카테고리 클릭 이벤트 리스너 ---
            button.addEventListener("click", function(event) {
                event.preventDefault();
                filterButtons.forEach(btn => btn.classList.remove("active"));
                this.classList.add("active");

                const href = this.getAttribute("href");
                const queryString = href.includes("?") ? href.substring(href.indexOf("?")) : "";

                // [수정] 카테고리 클릭 시 offset=0 (1페이지)으로 리셋
                const url = new URL(window.location.origin + "/ajax/post-list");
                url.search = queryString; // 예: category=꿀팁
                url.searchParams.set("offset", "0"); // 1페이지로 리셋

                fetch(url.toString()) // 예: /ajax/post-list?category=꿀팁&offset=0
                    .then(response => response.text())
                    .then(html => {
                        contentWrapper.innerHTML = html;

                        // 브라우저 URL 변경 (페이지 번호는 숨김)
                        const historyUrl = new URL(window.location.origin + "/");
                        historyUrl.search = queryString;
                        window.history.pushState(null, '', historyUrl.toString());
                    })
                    .catch(error => console.error("카테고리 목록 로딩 오류:", error));
            });
        });
      }

      // --- 2. [추가] 페이지네이션 AJAX 처리 (이벤트 위임) ---
      // contentWrapper는 AJAX로 내용이 바뀌어도 항상 존재하므로 여기에 이벤트를 위임
      contentWrapper.addEventListener('click', function(event) {

          // 1. 클릭된 요소가 .page-link 인지 확인
          const pageLink = event.target.closest('.page-link');

          // 2. pageLink가 아니면 무시 (카테고리 링크 등 다른 클릭은 무시)
          if (!pageLink) {
              return;
          }

          // 3. <a> 태그의 기본 동작 (페이지 이동) 막기
          event.preventDefault();

          // 4. 비활성화된 버튼(disabled)이나 현재 페이지(active)면 무시
          const pageItem = pageLink.closest('.page-item');
          if (pageItem.classList.contains('disabled') || pageItem.classList.contains('active')) {
              return;
          }

          // 5. 클릭한 링크의 href 속성 (예: "/?category=꿀팁&offset=10")을 가져옴
          const href = pageLink.getAttribute("href");

          // 6. href에서 쿼리 파라미터만 추출 (예: "?category=꿀팁&offset=10")
          const queryString = href.substring(href.indexOf("?"));

          // 7. AJAX 엔드포인트로 요청 (예: /ajax/post-list?category=꿀팁&offset=10)
          fetch(`/ajax/post-list${queryString}`)
              .then(response => response.text())
              .then(html => {
                  // 8. 받아온 HTML 텍스트로 내용 교체
                  contentWrapper.innerHTML = html;

                  // 9. 브라우저 URL 변경 (주소창에 offset 반영)
                  const historyUrl = new URL(window.location.origin + "/");
                  historyUrl.search = queryString;
                  window.history.pushState(null, '', historyUrl.toString());
              })
              .catch(error => console.error("페이지 로딩 오류:", error));
      });

    });
</script>
</body>
</html>
