<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post.title}">게시글 상세보기</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="w-[1200px] mx-auto mb-8 p-4 bg-white">

    <!-- 헤더 -->
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="w-[1140px] mx-auto flex flex-col lg:flex-row lg:space-x-8">

        <!-- 메인 영역 -->
        <main class="flex-1">

            <!-- 글 헤더 -->
            <div class="flex justify-between items-center h-16 border-b border-gray-300">
                <span class="font-semibold text-lg" th:text="${post.nickname}">작성자</span>

                <div class="flex items-center text-sm text-gray-500 space-x-4">
                    <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</span>
                    <span th:text="|조회 : ${post.viewCount}|">조회</span>
                    <span>추천 : <span id="recommend-count" th:text="${post.recommendationsCount}">0</span></span>
                </div>
            </div>

            <!-- 제목 + 내용 -->
            <div class="py-6 min-h-[500px]">
                <div class="mb-6">
                    <span class="text-blue-600 font-semibold"
                          th:text="|[${post.categoryName}]|">[카테고리]</span>

                    <h1 class="text-3xl font-bold mt-2" th:text="${post.title}">제목</h1>
                </div>

                <div class="prose max-w-none min-h-[300px]" th:utext="${post.content}"></div>
            </div>

            <!-- 버튼 영역 -->
            <div class="flex justify-between items-center border-t border-gray-300 pt-6">

                <!-- 신고하기 -->
                <button id="report-btn"
                        class="text-sm text-gray-500 hover:underline">
                    신고하기
                </button>

                <div class="flex justify-center py-12">
                    <button type="button"
                            id="recommend-btn"
                            onclick="recommendPost()"
                            class="w-28 h-28 border-2 border-blue-500 rounded-xl bg-white text-blue-500
                   flex flex-col items-center justify-center gap-2
                   hover:bg-blue-50 hover:scale-105 transition duration-200 ease-in-out shadow-sm">

                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-10 h-10">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6.633 10.5c.806 0 1.533-.446 2.031-1.08a9.041 9.041 0 012.861-2.4c.723-.384 1.35-.956 1.653-1.715a4.498 4.498 0 00.322-1.672V3a2.25 2.25 0 012.25 2.25c0 1.152-.26 2.247-.723 3.218-.266.558.107 1.282.725 1.282h3.126c1.026 0 1.945.694 2.054 1.715.045.422.068.85.068 1.285a11.95 11.95 0 01-2.649 7.521c-.388.482-.987.729-1.605.729H13.48c-.483 0-.964-.078-1.423-.23l-3.114-1.04a4.501 4.501 0 00-1.423-.23H5.904M14.25 9h2.25M5.904 18.75c.729%200%201.416.288%201.903.808.526.565.856%201.254.96%201.998a2.25%202.25%200%2001-2.235%202.29H5.62a2.25%202.25%200%2001-2.25-2.25v-8.18c0-.64.252-1.254.704-1.716l1.83-1.83" />
                        </svg>

                        <div class="text-center">
                            <span class="text-lg font-bold block">추천</span>
                        </div>
                    </button>

                    <input type="hidden" id="post-id" th:value="${post.id}">
                    <input type="hidden" id="is-logged-in" th:value="${loginMember != null}">
                </div>

                <!-- 수정, 삭제, 돌아가기 -->
                <div class="flex gap-2">

                    <a th:href="@{|/board/edit/${post.id}|}"
                       th:if="${loginMember != null and loginMember.id == post.memberId}"
                       class="w-20 h-12 flex items-center justify-center bg-blue-50 hover:bg-gray-200 rounded-lg font-medium">
                        수정
                    </a>

                    <form th:action="@{|/board/delete/${post.id}|}" method="post"
                          th:if="${loginMember != null and (loginMember.id == post.memberId or loginMember.grade == '관리자')}"
                          onsubmit="return confirm('정말 이 게시글을 삭제하시겠습니까?');">
                        <button type="submit"
                                class="w-20 h-12 flex items-center justify-center bg-red-500 hover:bg-red-600 text-white rounded-lg font-medium">
                            삭제
                        </button>
                    </form>

                    <a th:href="@{/}"
                       class="w-32 h-12 flex items-center justify-center bg-blue-100 hover:bg-gray-200 rounded-lg">
                        돌아가기
                    </a>

                </div>
            </div>

            <!-- 신고 입력 폼 -->
            <div id="report-form-area"
                 class="hidden mt-4 w-full">

                <form th:action="@{/comments/report}" method="post"
                      class="w-full p-4 border border-red-200 bg-red-50 rounded-lg space-y-3">

                    <div class="flex items-center justify-between">
                        <span class="text-sm font-semibold text-red-600">신고 내용 작성</span>
                    </div>

                    <textarea name="content"
                              class="w-full border border-red-200 rounded-md p-3 text-sm
                                     focus:outline-none focus:ring-2 focus:ring-red-400"
                              rows="4"
                              placeholder="신고 내용을 입력하세요..."
                              required></textarea>

                    <input type="hidden" name="postId" th:value="${post.id}" />

                    <div class="flex gap-2 justify-end">
                        <button class="px-3 py-1 bg-red-600 text-white rounded text-sm">
                            신고 등록
                        </button>

                        <button type="button" id="report-cancel"
                                class="px-3 py-1 bg-gray-300 rounded text-sm">
                            취소
                        </button>
                    </div>
                </form>
            </div>


            <!-- 댓글 영역 -->
            <div class="mt-10">

                <!-- 댓글 수 -->
                <div class="flex items-center gap-2 border-b border-gray-300 pb-3">
    <span class="font-semibold"
          th:text="|댓글 (${#lists.size(comments.?[!content.contains('[신고]')])})|">
    </span>
                </div>

                <div id="comment-list" class="mt-4">

                    <div th:if="${#lists.isEmpty(comments)}"
                         class="text-center text-gray-500 py-10">
                        등록된 댓글이 없습니다.
                    </div>

                    <!-- 댓글 반복 -->
                    <div th:each="c : ${comments}"
                         th:with="isEditing=${param.editId != null and T(java.lang.Long).valueOf(param.editId[0]) == c.id}"
                         class="py-4 border-b border-gray-100">

                        <!-- 신고 댓글 숨김 처리 -->
                        <div th:if="${!(c.content.startsWith('[신고]')
                            and (loginMember == null
                            or (loginMember.id != c.memberId and loginMember.grade != '관리자')))}">

                            <!-- 일반 보기 모드 -->
                            <div th:if="${!isEditing}">
                                <div class="flex items-center justify-between">
                                    <span class="font-semibold" th:text="${c.nickname}">작성자</span>
                                    <span class="text-xs text-gray-400"
                                          th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                                </div>

                                <p class="mt-2"
                                   th:classappend="${c.content.startsWith('[신고]') ? 'text-red-600 font-semibold' : 'text-gray-700'}"
                                   th:text="${c.content}">
                                </p>

                                <!-- 본인 또는 관리자만 수정/삭제 -->
                                <div class="mt-2 flex gap-2"
                                     th:if="${loginMember != null}">

                                    <a th:href="@{|/board/detail/${post.id}?editId=${c.id}|}"
                                       th:if="${loginMember.id == c.memberId}"
                                       class="px-2 py-1 text-sm rounded-md border border-blue-300 bg-blue-50 text-blue-600 hover:bg-blue-100 transition">
                                        수정
                                    </a>

                                    <form th:action="@{|/comments/${c.id}/delete|}" method="post"
                                          th:if="${loginMember.id == c.memberId or loginMember.grade == '관리자'}">
                                        <input type="hidden" name="postId" th:value="${post.id}">
                                        <button class="px-2 py-1 bg-red-500 text-white text-sm rounded"
                                                onclick="return confirm('정말 삭제하시겠습니까?');">
                                            삭제
                                        </button>
                                    </form>
                                </div>
                            </div>

                            <!-- 수정 모드 -->
                            <div th:if="${isEditing}">
                                <form th:action="@{|/comments/${c.id}/edit|}" method="post">
                                    <textarea name="content"
                                              class="w-full p-2 border rounded mb-2"
                                              th:text="${c.content}" required></textarea>
                                    <input type="hidden" name="postId" th:value="${post.id}">

                                    <div class="flex gap-2">
                                        <button class="px-3 py-1 bg-blue-600 text-white rounded">수정 완료</button>
                                        <a th:href="@{|/board/detail/${post.id}|}"
                                           class="px-3 py-1 bg-gray-300 rounded">취소</a>
                                    </div>
                                </form>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- 댓글 작성 -->
                <form th:action="@{/comments/{postId}(postId=${post.id})}" method="post"
                      class="mt-6 p-4 bg-gray-50 rounded-lg">
                    <textarea name="content"
                              class="w-full p-3 border border-gray-300 rounded mb-3"
                              placeholder="댓글을 입력하세요..."
                              required></textarea>

                    <input type="hidden" name="postId" th:value="${post.id}">

                    <button class="px-4 py-2 bg-blue-600 text-white rounded">
                        등록
                    </button>
                </form>

            </div>

        </main>

        <!-- 광고 -->
        <aside class="w-full lg:w-80 lg:flex-shrink-0 mt-8 lg:mt-0">
            <div class="bg-white rounded-lg shadow-md h-[960px] flex items-center justify-center border
                        bg-[url('/image/ad2.png')] bg-contain bg-no-repeat bg-center">
                <div class="ad-box"></div>
            </div>
        </aside>

    </div>

    <!-- 푸터 -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</div>

<!-- 알림 -->
<script th:if="${param.msg}">
    const msg = /*[[${param.msg}]]*/ null;
    if (msg === 'created') alert('댓글이 등록되었습니다.');
    if (msg === 'edited') alert('댓글이 수정되었습니다.');
    if (msg === 'deleted') alert('댓글이 삭제되었습니다.');
</script>

<!-- 신고 JS -->
<script>
    const reportBtn = document.getElementById("report-btn");
    const reportArea = document.getElementById("report-form-area");
    const reportCancel = document.getElementById("report-cancel");

    reportBtn.addEventListener("click", () => {
        reportArea.classList.remove("hidden");
    });

    reportCancel.addEventListener("click", () => {
        reportArea.classList.add("hidden");
    });
</script>
<script>
    // 게시글 삭제 확인
    const postDeleteForm = document.querySelector('form[th\\:action*="/board/delete/"]');
    if (postDeleteForm){
        postDeleteForm.addEventListener('submit', function(e){
            if(!confirm("게시글과 관련 댓글까지 정말 삭제하시겠습니까?")) {
                e.preventDefault();
            }
        });
    }

    // 댓글 삭제 확인
    document.querySelectorAll('form[th\\:action*="/comments/"][th\\:action*="/delete"]').forEach(form => {
        form.addEventListener('submit', function(e){
            e.preventDefault(); // 기본 제출 막기
            if(confirm("댓글을 정말 삭제하시겠습니까?")) {
                form.submit(); // 확인 시 실제 제출
            }
        });
    });
</script>
<script>
    function recommendPost() {
        // 1. 로그인 여부 확인
        const isLoggedIn = document.getElementById("is-logged-in").value === 'true';

        if (!isLoggedIn) {
            alert("로그인이 필요한 서비스입니다.");
            // 필요하다면 로그인 페이지로 이동: location.href = '/member/login';
            return;
        }

        // 2. 게시글 ID 가져오기
        const postId = document.getElementById("post-id").value;

        // 3. AJAX 요청 (fetch)
        fetch(`/board/recommend/${postId}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                // 스프링 시큐리티 사용 시 CSRF 토큰이 필요할 수 있습니다.
                // "X-CSRF-TOKEN": document.querySelector('meta[name="_csrf"]').content
            }
        })
        .then(response => response.json()) // 서버에서 JSON 응답을 기대함
        .then(data => {
            if (data.success) {
                // 성공 시: 상단 추천 수 업데이트
                const countSpan = document.getElementById("recommend-count");
                countSpan.innerText = data.newCount;
                alert("추천하였습니다!");
            } else {
                // 실패 시 (이미 추천함 등): 메시지 출력
                alert(data.message);
            }
        })
        .catch(error => {
            console.error("Error:", error);
            alert("오류가 발생했습니다.");
        });
    }
</script>

</body>
</html>
