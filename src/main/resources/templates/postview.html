<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post.title}">게시글 상세보기</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-gray-100">

<div class="w-[1200px] mx-auto mt-8 mb-8 p-4 bg-white rounded-lg shadow-lg">

    <!-- 헤더 -->
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="w-[1140px] mx-auto flex flex-col lg:flex-row lg:space-x-8">

        <!-- 메인 영역 -->
        <main class="flex-1">

            <!-- 글 헤더 -->
            <div class="flex justify-between items-center h-16 border-b border-gray-300">
                <span class="font-semibold text-lg" th:text="${post.nickname}">작성자</span>

                <div class="flex items-center text-sm text-gray-500 space-x-4">
                    <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</span>
                    <span th:text="|조회 : ${post.viewCount}|">조회</span>
                    <span th:text="|추천 : ${post.recommendationsCount}|">추천</span>
                </div>
            </div>

            <!-- 제목 + 내용 -->
            <div class="py-6 min-h-[500px]">
                <div class="mb-6">
                    <span class="text-blue-600 font-semibold"
                          th:text="|[${post.categoryName}]|">[카테고리]</span>

                    <h1 class="text-3xl font-bold mt-2" th:text="${post.title}">제목</h1>
                </div>

                <div class="prose max-w-none min-h-[300px]" th:utext="${post.content}"></div>
            </div>

            <!-- 버튼 영역 -->
            <div class="flex justify-between items-center border-t border-gray-300 pt-6">
                <a class="text-sm text-gray-500 hover:underline" href="#">신고하기</a>

                <div class="flex gap-2">

                    <a th:href="@{|/board/edit/${post.id}|}"
                       th:if="${loginMember != null and loginMember.id == post.memberId}"
                       class="w-20 h-12 flex items-center justify-center bg-gray-100 hover:bg-gray-200 rounded-lg font-medium">
                        수정
                    </a>

                    <form th:action="@{|/board/delete/${post.id}|}" method="post"
                          th:if="${loginMember != null and (loginMember.id == post.memberId or loginMember.grade == '2')}"
                          onsubmit="return confirm('정말 이 게시글을 삭제하시겠습니까?');">
                        <button type="submit"
                                class="w-20 h-12 flex items-center justify-center bg-red-500 hover:bg-red-600 text-white rounded-lg font-medium">
                            삭제
                        </button>
                    </form>

                    <a th:href="@{/}"
                       class="w-32 h-12 flex items-center justify-center bg-gray-100 hover:bg-gray-200 rounded-lg">
                        돌아가기
                    </a>
                </div>
            </div>

            <!-- 댓글 영역 -->
            <div class="mt-10">

                <!-- 댓글 수 -->
                <div class="flex items-center gap-2 border-b border-gray-300 pb-3">
                    <span class="font-semibold" th:text="|댓글 (${#lists.size(comments)})|"></span>
                </div>

                <!-- 댓글 리스트 -->
                <div id="comment-list" class="mt-4">

                    <!-- 댓글 없음 -->
                    <div th:if="${#lists.isEmpty(comments)}"
                         class="text-center text-gray-500 py-10">등록된 댓글이 없습니다.</div>

                    <!-- 댓글 반복 -->
                    <div th:each="c : ${comments}"
                         th:with="isEditing=${param.editId != null and T(java.lang.Long).valueOf(param.editId[0]) == c.id}"
                         class="py-4 border-b border-gray-100">

                        <!-- ⭐ 일반 모드 -->
                        <div th:if="${!isEditing}">
                            <div class="flex items-center justify-between">
                                <span class="font-semibold" th:text="${c.nickname}">작성자</span>
                                <span class="text-xs text-gray-400"
                                      th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                            </div>

                            <p class="mt-2 text-gray-700" th:text="${c.content}">내용</p>

                            <!-- 본인 댓글만 버튼 보임 -->
                            <div class="mt-2 flex gap-2"
                                 th:if="${loginMember != null}">

                                <a th:href="@{|/board/detail/${post.id}?editId=${c.id}|}"
                                   th:if="${loginMember.id == c.memberId}"
                                   class="px-2 py-1 text-sm rounded-md
                            border border-blue-300
                            bg-blue-50 text-blue-600
                            hover:bg-blue-100 transition">
                                    수정
                                </a>

                                <form th:action="@{|/comments/${c.id}/delete|}" method="post"
                                      th:if="${loginMember.id == c.memberId or loginMember.grade == '2'}">
                                    <input type="hidden" name="postId" th:value="${post.id}">

                                    <button class="px-2 py-1 bg-red-500 text-white text-sm rounded"
                                            onclick="return confirm('정말 삭제하시겠습니까?');">
                                        삭제
                                    </button>
                                </form>
                            </div>
                        </div>

                        <!-- ⭐ 수정 모드 (인라인 편집) -->
                        <div th:if="${isEditing}">
                            <form th:action="@{|/comments/${c.id}/edit|}" method="post">

                                <textarea name="content"
                                          class="w-full p-2 border rounded mb-2"
                                          th:text="${c.content}" required></textarea>

                                <input type="hidden" name="postId" th:value="${post.id}">

                                <div class="flex gap-2">
                                    <button class="px-3 py-1 bg-blue-600 text-white rounded">
                                        수정 완료
                                    </button>

                                    <a th:href="@{|/board/detail/${post.id}|}"
                                       class="px-3 py-1 bg-gray-300 rounded">
                                        취소
                                    </a>
                                </div>

                            </form>
                        </div>

                    </div> <!-- 댓글 반복 끝 -->

                </div> <!-- 댓글 리스트 끝 -->

                <!-- 댓글 작성 -->
                <form th:action="@{/comments/{postId}(postId=${post.id})}" method="post"
                      class="mt-6 p-4 bg-gray-50 rounded-lg">

                    <textarea name="content"
                              class="w-full p-3 border border-gray-300 rounded mb-3"
                              placeholder="댓글을 입력하세요..." required></textarea>

                    <input type="hidden" name="postId" th:value="${post.id}">

                    <button class="px-4 py-2 bg-blue-600 text-white rounded">
                        등록
                    </button>
                </form>

            </div> <!-- 댓글 영역 끝 -->

        </main>

        <!-- 사이드 광고 -->
        <aside class="w-full lg:w-80 lg:flex-shrink-0 mt-8 lg:mt-0">
            <div class="bg-white rounded-lg shadow-md h-[960px] flex items-center justify-center border">
                <span class="text-gray-500 text-2xl">광고 (W310)</span>
            </div>
        </aside>

    </div>

    <!-- 푸터 -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</div>

<!-- 🔔 메시지 알림 -->
<script th:if="${param.msg}">
    const msg = /*[[${param.msg}]]*/ null;
    if (msg === 'created') alert('댓글이 등록되었습니다.');
    if (msg === 'edited') alert('댓글이 수정되었습니다.');
    if (msg === 'deleted') alert('댓글이 삭제되었습니다.');
</script>

</body>
</html>
