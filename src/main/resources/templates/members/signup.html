<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <title>회원가입</title>
</head>
<body>
<div class="container">
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="signup-form">
        <form id="signup-form-element"
              th:action="@{/members/signup}"
              method="post"
              th:object="${memberForm}"
              enctype="multipart/form-data" novalidate>

            <div class="signup-form__group">
                <label for="email" class="signup-form__label">Email*</label>
                <input type="email" id="email" name="email" class="signup-form__input" placeholder="Email address" required>
                <div class="signup-form__error-message" id="email-error"></div>
            </div>

            <div class="signup-form__group">
                <label for="password" class="signup-form__label">Password*</label>
                <input type="password" id="password" name="pwd" class="signup-form__input" placeholder="Password" required>
                <div class="signup-form__error-message" id="password-error"></div>
            </div>

            <div class="signup-form__group">
                <label for="password-check" class="signup-form__label">Password check*</label>
                <input type="password" id="password-check" name="passwordCheck" class="signup-form__input" placeholder="Password check" required>
                <div class="signup-form__error-message" id="password-check-error"></div>
            </div>

            <div class="signup-form__group">
                <label for="nickname" class="signup-form__label">Nickname*</label>
                <input type="text" id="nickname" name="nickname" class="signup-form__input" placeholder="Nickname" required>
                <div class="signup-form__error-message" id="nickname-error"></div>
            </div>


            <div class="signup-form__group">
                <label for="profile-image" class="signup-form__label">Profile Image Upload</label>
                <input type="file" id="profile-image" name="profileImage" class="signup-form__input" accept="image/*">
            </div>

            <button type="submit" class="signup-form__button">Create account ></button>

        </form>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
<script>
    const urlParams = new URLSearchParams(window.location.search);

    // 로그인 성공/실패
    if (urlParams.get("loginSuccess") === "true") {
        alert("로그인 성공!");
    }
    if (urlParams.get("loginFail") === "true") {
        alert("로그인 실패! 이메일 또는 비밀번호 확인");
    }

    // 회원가입 성공/실패
    if (urlParams.get("signupSuccess") === "true") {
        alert("회원가입 완료!");
    }
    if (urlParams.get("signupFail") === "passwordMismatch") {
        alert("비밀번호 확인이 일치하지 않습니다");
    }
    if (urlParams.get("signupFail") === "emailExists") {
        alert("이미 사용 중인 이메일입니다");
    }
    if (urlParams.get("signupFail") === "nicknameExists") {
        alert("이미 사용 중인 닉네임입니다");
    }

    // 비밀번호 재설정 성공/실패
    if (urlParams.get("resetSuccess") === "true") {
        alert("비밀번호 변경 완료!");
    }
    if (urlParams.get("resetFail") === "true") {
        alert("비밀번호 변경 실패!");
    }

    // model.addAttribute("error")는 thymeleaf에서 alert 처리 가능
</script>

<script th:src="@{/js/signup.validation.js}"></script>

</body>
</html>
