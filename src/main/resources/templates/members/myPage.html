<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <title>My Page</title>
</head>
<body>
<div class="container">
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="profile-container">
        <div class="profile-info">
            <div class="profile-info__avatar-wrapper">
                <img id="profile-image"
                     th:src="@{|${member.profileImg}|}"
                     onerror="this.onerror=null; this.src='/image/emptyProfile.png';"
                     alt="User Avatar"
                     class="profile-info__avatar">
            </div>
            <p id="display-username" class="profile-info__username" th:text="${member.nickname}">username</p>
            <p id="display-points" class="profile-info__points" th:text="${member.point}">P : 1530</p>

            <button id="edit-profile-button" class="profile-info__edit-button">Edit Profile</button>

            <form id="auth-section" class="auth-section hidden" th:action="@{|${member.id}/verify-password|}" method="post">
                <div class="auth-section__password-input-group">
                    <label for="enter-password" class="auth-section__label">Enter Password</label>
                    <input type="password" id="enter-password" class="auth-section__input" placeholder="Enter Password" name="pwd" required>
                </div>
            </form>

            <form id="edit-fields-section" class="edit-fields-section hidden"
                  th:action="@{|/members/${member.id}/edit|}"
                  method="post"
                  enctype="multipart/form-data">

                <div class="edit-fields-section__group">
                    <label for="edit-username" class="edit-fields-section__label">Edit username</label>
                    <input type="text" id="edit-username" class="edit-fields-section__input" name="nickname"
                           th:value="${member.nickname}">
                    <div class="signup-form__error-message" id="nickname-error"></div>
                </div>
                <div class="edit-fields-section__group">
                    <label for="edit-password" class="edit-fields-section__label">Edit password</label>
                    <input type="password" id="edit-password" class="edit-fields-section__input" name="pwd">
                    <div class="signup-form__error-message" id="password-error"></div>
                </div>

                <div class="edit-fields-section__group">
                    <label for="password-check" class="edit-fields-section__label">Password check</label>
                    <input type="password" id="password-check" class="edit-fields-section__input">
                    <div class="signup-form__error-message" id="password-check-error"></div>
                </div>

                <div class="edit-fields-section__group">
                    <label for="upload-profile-image" class="edit-fields-section__label">Edit Profile Image</label>
                    <label for="upload-profile-image" class="edit-fields-section__upload-label">Upload Profile Image</label>
                    <input type="file" id="upload-profile-image" class="edit-fields-section__upload-input" accept="image/*" name="profileImage">
                </div>

                <div class="edit-fields-section__buttons">
                    <button type="submit" id="save-button" class="edit-fields-section__button edit-fields-section__button--save">Save</button>
                    <button type="reset" id="cancel-button" class="edit-fields-section__button edit-fields-section__button--cancel">Cancel</button>
                    <button type="submit" id="delete-button" class="edit-fields-section__button edit-fields-section__button--delete">Delete</button>
                </div>

            </form>

            <div th:if="${error}" class="error-message">
                <p th:text="${error}"></p>
            </div>

        </div>

        <div class="content-lists">
            <div class="content-list__section">
                <h3 class="content-list__title">My Post list</h3>
                <div class="content-list__placeholder">게시물이 없습니다.</div>
            </div>
            <div class="content-list__section">
                <h3 class="content-list__title">My Comment list</h3>
                <div class="content-list__placeholder">댓글이 없습니다.</div>
            </div>
        </div>
    </div>


    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
<script th:src="@{/js/member-edit.validation.js}"></script>
<script th:inline="javascript">


    // ⭐️⭐️⭐️ 동적 기능 JavaScript ⭐️⭐️⭐️

    // 이 줄(DOMContentLoaded)이 빠지면 오류가 발생할 수 있습니다.
    document.addEventListener('DOMContentLoaded', function() {

        // DOM 요소들 가져오기
        const editProfileButton = document.getElementById('edit-profile-button');
        const authSection = document.getElementById('auth-section');
        const enterPasswordInput = document.getElementById('enter-password');
        const editFieldsSection = document.getElementById('edit-fields-section');
        const editUsernameInput = document.getElementById('edit-username');
        const editPasswordInput = document.getElementById('edit-password');
        const uploadProfileImageInput = document.getElementById('upload-profile-image');
        const saveButton = document.getElementById('save-button');
        const cancelButton = document.getElementById('cancel-button');
        const deleteButton = document.getElementById('delete-button');
        const profileImg = document.getElementById('profile-image');
        const displayUsername = document.getElementById('display-username');
        const displayPoints = document.getElementById('display-points');

        // --- 2. 이벤트 리스너 설정 ---

        // A. "Edit Profile" 버튼 클릭 시
        editProfileButton.addEventListener('click', function() {
            authSection.classList.remove('hidden'); // Enter Password 필드 보이기
            enterPasswordInput.focus(); // Enter Password 필드에 포커스
            if (!editFieldsSection.classList.contains('hidden')) {
                // 이미 열려있으면 아무것도 안함
            } else {
                 enterPasswordInput.value = ''; // 항상 초기화
                 editFieldsSection.classList.add('hidden'); // 수정 필드는 다시 숨김
            }
        });

        // A-2. 비밀번호 입력 창 벗어날 시
        enterPasswordInput.addEventListener('blur', function() {
            authSection.classList.add('hidden');
        });

        // B. 비밀번호 입력
        document.getElementById("auth-section").addEventListener("submit", function(e) {
            e.preventDefault(); // 기본 제출 막기

            const form = e.target;
            const formData = new FormData(form);

            fetch(form.action, {
                method: form.method,
                body: formData
            })
            .then(response => response.text())
            .then(result => {
                if (result === "true") {
                    document.getElementById("edit-fields-section").classList.remove("hidden");
                    document.getElementById("auth-section").classList.add("hidden");
                } else {
                    alert("비밀번호가 일치하지 않습니다.");
                }
            });
        });


        // B-2. "Upload profile Image"
        uploadProfileImageInput.addEventListener('change', function() {
                const newImageFile = uploadProfileImageInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    profileImg.src = e.target.result;
                };
                reader.readAsDataURL(newImageFile);
        });

        // C. "Save" 버튼 클릭 시

        // D. "Cancel" 버튼 클릭 시
        cancelButton.addEventListener('click', function() {
            editFieldsSection.classList.add('hidden');
            authSection.classList.add('hidden');
            enterPasswordInput.value = '';
            editUsernameInput.value = displayUsername.textContent;
            editPasswordInput.value = '';
            uploadProfileImageInput.value = '';
        });

        // E. "Delete" 버튼 클릭 시

        deleteButton.addEventListener('click', function (e) {
            if (!confirm("정말로 계정을 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.")) {
                e.preventDefault();
                return;
            }

            const form = document.getElementById("edit-fields-section");
            const memberId = [[${member.id}]]; // Thymeleaf에서 member.id 삽입
            form.action = `/members/${memberId}/delete`; // action 변경
        });



    // ⭐️⭐️⭐️ 이 '}'(닫는 중괄호)가 document.addEventListener의 짝입니다.
    // ⭐️⭐️⭐️ 이 부분이 누락되거나, 이 뒤에 }가 더 있으면 오류가 발생합니다.
    });

</script>

</body>
</html>
